[package]
name = "export"
description = "rta-export: game files, saves and recorded sessions -> site data"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rta-export"
path = "src/bin/rta-export.rs"

[dependencies]
telemetry.workspace = true
upload.workspace = true
ride4-data.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[[bin]]
name = "rta-photos"
path = "src/bin/rta-photos.rs"
