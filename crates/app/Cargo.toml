[package]
name = "app"
description = "Ride Time Attack live logger (Dear ImGui)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "rta-logger"
path = "src/main.rs"

[dependencies]
ride4-mem.workspace = true
telemetry.workspace = true
export.workspace = true
upload.workspace = true
serde.workspace = true
serde_json.workspace = true
imgui = "0.12"
imgui-winit-support = "0.13"
imgui-glow-renderer = "0.13"
glow = "0.14"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
winit = { version = "0.30", features = ["rwh_06"] }
libc = "0.2"
png = "0.17"
