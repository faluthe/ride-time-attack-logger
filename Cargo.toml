[workspace]
resolver = "2"
members = ["crates/ride4-mem", "crates/telemetry", "crates/app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ride4-mem = { path = "crates/ride4-mem" }
telemetry = { path = "crates/telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
